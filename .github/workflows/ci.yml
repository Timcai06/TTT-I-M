name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Deterministic gates: typecheck + lint (both workspaces), unit tests, build
  # both apps, and run all deterministic build guards (chunk budget, chapter-state, frame,
  # loader-preload, content-layer, deferred-image bytes, Continuum GPU, platform). These must
  # always pass.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit # node --test over landing pure-logic modules
      - run: npm run build:studio
      - run: npm run test:build # builds landing + landing build guards + platform guard

  # Runtime gates: real-browser Playwright (frame structure + Plan 05 perf budgets).
  #
  # ADVISORY in CI (continue-on-error), AUTHORITATIVE locally. These tests drive the
  # full Lenis + GSAP + ScrollTrigger + IntersectionObserver + WebGL pipeline, whose
  # settling timing is hardware-variant on shared 2-core CI runners — the same test
  # passes one run and flakes the next. They run reliably on a real local machine
  # (verified 16/16). So CI runs them for VISIBILITY but does not block on them; the
  # hard gate is `verify` (typecheck/lint/build/studio + deterministic build guards). Run
  # `npm run test:e2e` locally before merging UI/scroll changes.
  # 2026-06-11: the deterministic load-time subset (chrome-ui, hero-pretext) was
  # promoted into the blocking `e2e-gates` job below. What remains advisory here
  # is the scroll-scrub/perf set (frame, mobile, performance) whose remaining
  # waitForTimeout()s pace scrub animations — converting those changes test
  # semantics, so they stay local-authoritative for now.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # Perf budgets get CI headroom via PERF_* env (2-core runner is slower than
      # local M-series). Load long tasks balloon during WebGL init under the covered
      # loader (~580ms observed); scroll scrub can spike under runner contention.
      # Critical-only gate (2026-06-10): local budget 2800ms; CI 2-core headroom.
      PERF_LCP_MS: '4500'
      PERF_HEAP_MB: '110'
      PERF_LOAD_LONGTASK_MS: '700'
      PERF_SCROLL_LONGTASK_MS: '300'
      # INP/FPS gates (2026-06-12): 2-core headless runners jank far above any
      # real device; budgets are wide so only severe regressions trip them.
      PERF_INP_MS: '500'
      PERF_FRAME_P95_MS: '160'
      PERF_FRAME_MIN_SAMPLES: '20'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/landing
      - run: npm run test:e2e
        working-directory: apps/landing

  # Cross-zone runtime smoke: BLOCKING on pushes to main. Fetches the *deployed*
  # main domain and asserts /blog,/work,/dashboard HTML + their /_next assets all
  # 200 — the exact failure the string-based platform guard cannot see (the
  # 2026-06-05 unstyled-blog incident). Not run on PRs: it checks current prod,
  # not the PR's change, so a prod-side issue would block unrelated PRs.
  cross-zone-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/runtime/cross-zone-smoke.mjs

  # Deterministic e2e gates: BLOCKING. Degradation (reduced motion, no WebGL,
  # 404 asset — load-time only) plus the promoted deterministic subset:
  # chrome-ui (nav/scroll-indicator via condition waits only) and hero-pretext
  # (load-time hover, no fixed waits). No fixed-wait scroll scrubbing here, so
  # these are stable on shared runners — unlike the advisory `e2e` job above.
  e2e-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/landing
      - run: npm run test:e2e:gates
        working-directory: apps/landing

  # Chromium's HTML-in-Canvas API is still experimental, so keep its proof in
  # a separate blocking lane. Stable-browser fallback remains covered above;
  # this lane verifies that the enhanced Bend/Laser path also renders and that
  # a lost WebGL context restores the DOM fallback instead of leaking budget.
  e2e-canvas-experimental:
    runs-on: ubuntu-latest
    env:
      HTML_CANVAS_EXPERIMENTAL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/landing
      - run: npm run test:e2e:canvas-experimental
        working-directory: apps/landing
