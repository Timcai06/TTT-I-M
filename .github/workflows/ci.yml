name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The extended e2e lane runs here instead of on every push. See the `e2e` job.
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

# One run per ref. Three commits pushed in a row used to start three full CI
# runs that all kept going, each carrying an e2e job that could burn 94 minutes;
# nothing cancelled the runs the next push had already made irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deterministic gates: typecheck + lint (both workspaces), unit tests, build
  # both apps, and run all deterministic build guards (chunk budget, chapter-state, frame,
  # loader-preload, content-layer, deferred-image bytes, effect lifecycle, vendor integrity,
  # and platform boundaries). These must
  # always pass.
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit # node --test over landing pure-logic modules
      - run: npm run build:studio
      - run: npm run test:build # builds landing + landing build guards + platform guard

  # Extended runtime coverage: the archive room, loader, frame, mobile and the
  # hardware-sensitive performance budgets. NIGHTLY, not per-push.
  #
  # It used to run all 20 specs on every push, advisory, taking 78-94 minutes -
  # by far the most expensive thing in CI. Six of those specs are the ones
  # `e2e-gates` already runs as a blocking lane, so that work was done twice, and
  # `continue-on-error: true` meant the result never affected anything. Expensive,
  # duplicated, and unread: it had been red for weeks without anyone noticing.
  #
  # So it now runs the thirteen specs that no other lane covers, once a night,
  # and reports honestly instead of being marked advisory - on a schedule there
  # is nothing for it to block, so hiding its result buys nothing.
  #
  # Its archive specs deserve to be a blocking per-push lane. That is a follow-up
  # and it is gated on their current failures being fixed, not on CI plumbing.
  e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Perf budgets get CI headroom via PERF_* env (2-core runner is slower than
      # local M-series). Load long tasks balloon during WebGL init under the covered
      # loader (~580ms observed); scroll scrub can spike under runner contention.
      # Critical-only gate (2026-06-10): local budget 2800ms; CI 2-core headroom.
      PERF_LCP_MS: '4500'
      PERF_HEAP_MB: '110'
      PERF_LOAD_LONGTASK_MS: '700'
      PERF_SCROLL_LONGTASK_MS: '300'
      # INP/FPS gates (2026-06-12): 2-core headless runners jank far above any
      # real device; budgets are wide so only severe regressions trip them.
      PERF_INP_MS: '500'
      PERF_FRAME_P95_MS: '160'
      PERF_FRAME_MIN_SAMPLES: '20'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # The browser binaries cache; the OS packages they link against do not, so
      # a cache hit still needs install-deps.
      - run: npx playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: apps/landing
      - run: npx playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: apps/landing
      - run: npm run test:e2e:extended
        working-directory: apps/landing
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-extended-${{ github.run_id }}-${{ github.run_attempt }}
          # playwright-report embeds the traces under its own data/ directory, so
          # uploading test-results as well shipped every trace twice.
          path: apps/landing/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # Cross-zone runtime smoke: BLOCKING on pushes to main. Fetches the *deployed*
  # main domain and asserts /blog,/work,/dashboard HTML + their /_next assets all
  # 200 — the exact failure the string-based platform guard cannot see (the
  # 2026-06-05 unstyled-blog incident). Not run on PRs: it checks current prod,
  # not the PR's change, so a prod-side issue would block unrelated PRs.
  cross-zone-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CROSS_ZONE_EXPECTED_SHA: ${{ github.sha }}
      CROSS_ZONE_DEPLOY_WAIT_MS: '540000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node tests/runtime/cross-zone-smoke.mjs

  # Product-safety e2e gates: BLOCKING. Accessibility, degradation (reduced
  # motion, no WebGL, missing image/renderer), navigation, Canvas fallback/context
  # lifecycle, Work gate, and representative scroll handoffs run here.
  e2e-gates:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Each shard is about a third of 40.8m. 30 leaves room for a slow runner.
    timeout-minutes: 30
    strategy:
      # Every shard must report. Without this, the first shard to fail cancels
      # the others and the failure list comes back truncated, which is the whole
      # reason this lane exists.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: apps/landing
      - run: npx playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: apps/landing
      # 24 tests at workers: 1, each paying the ~90s loader on its own page load,
      # is 40.8 minutes of mostly waiting. Three runners cut the wall clock to a
      # third for the same runner minutes.
      #
      # Hand-authored shards rather than playwright's --shard, which splits by
      # file: these six specs hold 8/6/5/3/1/1 tests and it divided them 9/14/1,
      # so the longest shard saved almost nothing. These are 8/8/8.
      # tests/e2eShards.test.ts asserts they still partition the lane exactly.
      - run: npm run test:e2e:gates:${{ matrix.shard }}
        working-directory: apps/landing
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-gates-${{ github.run_id }}-${{ github.run_attempt }}-shard${{ matrix.shard }}
          # playwright-report embeds the traces under its own data/ directory, so
          # uploading test-results as well shipped every trace twice.
          path: apps/landing/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # Chromium's HTML-in-Canvas API is still experimental, so keep its proof in
  # a separate blocking lane. Stable-browser fallback remains covered above;
  # this lane verifies that the enhanced Bend/Laser path also renders and that
  # a lost WebGL context restores the DOM fallback instead of leaking budget.
  e2e-canvas-experimental:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Two tests, each paying the ~90s loader once, against a 240s per-test cap.
    timeout-minutes: 25
    env:
      HTML_CANVAS_EXPERIMENTAL: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: apps/landing
      - run: npx playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: apps/landing
      - run: npm run test:e2e:canvas-experimental
        working-directory: apps/landing
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-canvas-experimental-${{ github.run_id }}-${{ github.run_attempt }}
          # playwright-report embeds the traces under its own data/ directory, so
          # uploading test-results as well shipped every trace twice.
          path: apps/landing/playwright-report
          retention-days: 7
          if-no-files-found: ignore
