<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Liquid Mercury / Chrome Metallic Gradient -->
    <linearGradient id="chromeLiquid" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#a0aec0"/>
      <stop offset="48%" stop-color="#1a202c"/>  <!-- Horizon dark reflection line -->
      <stop offset="52%" stop-color="#f7fafc"/>  <!-- Sharp bright horizon edge -->
      <stop offset="85%" stop-color="#718096"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    
    <!-- Cool Metallic Glow Filter -->
    <filter id="chromeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <!-- Primary soft icy aura -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1" />
      <feComponentTransfer in="blur1" result="glow1">
        <feFuncA type="linear" slope="0.7" />
      </feComponentTransfer>
      
      <!-- Core intense white glow -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="blur2" />
      <feComponentTransfer in="blur2" result="glow2">
        <feFuncA type="linear" slope="1.2" />
      </feComponentTransfer>

      <feMerge>
        <feMergeNode in="glow1"/>
        <feMergeNode in="glow2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Liquid Continuous Line 'T' Path -->
  <path d="M 10 20 
           C 24 10, 40 10, 54 20 
           C 52 24, 40 22, 36 24 
           C 36 32, 38 46, 36 50 
           C 36 58, 22 58, 16 50 
           C 22 52, 28 50, 28 44 
           C 26 36, 28 32, 28 24 
           C 24 22, 12 24, 10 20 
           Z" 
        fill="url(#chromeLiquid)" 
        filter="url(#chromeGlow)"/>
</svg>
